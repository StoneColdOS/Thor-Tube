name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time, newest wins, so two quick pushes never fight over the "latest" release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log; then
            # Compiler errors as annotations, so they're readable without downloading the log.
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          # Kotlin warnings as annotations too, so they're easy to spot and fix.
          { grep -E "^w: " build.log || true; } | sed 's#file:///home/runner/work/Thor-Tube/Thor-Tube/##' | head -50 | while IFS= read -r line; do
            echo "::warning::${line}"
          done
          cp app/build/outputs/apk/debug/app-debug.apk Thor-Tube-latest.apk

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: thor-tube-debug-${{ github.sha }}
          path: Thor-Tube-latest.apk
          if-no-files-found: error

      # Every push to main replaces the "latest" test release, so the newest
      # APK is always one tap away on the Releases page.
      - name: Update the "latest" test release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Test build #${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
            echo
            echo "Install Thor-Tube-latest.apk on the Thor. It updates over the previous test build (and installs next to CRT-Tube)."
            echo "Logs: Setup > Share logs."
          } > notes.md
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest Thor-Tube-latest.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest test build (#${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md
