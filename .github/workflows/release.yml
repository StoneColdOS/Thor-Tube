name: Release

on:
  push:
    tags: ["v*"]
  # Run by hand from the Actions tab to check the signing key works, without publishing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.THOR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::THOR_KEYSTORE_BASE64 secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "THOR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          THOR_KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          NAME="Thor-Tube-${GITHUB_REF_NAME//\//-}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the signature and that it isn't debuggable
        run: |
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --print-certs "$APK_NAME" | tee signature.txt
          # The release key's fingerprint; anything else means the wrong key was used.
          grep -qi "1156c0e695887529200b251d20d905672566bac7de51de4f97dd7565e8c5f781" <(tr -d ':' < signature.txt | tr 'A-F' 'a-f')
          if "$TOOLS/aapt2" dump badging "$APK_NAME" | grep -q "application-debuggable"; then
            echo "::error::Release APK is debuggable"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: thor-tube-release-${{ github.sha }}
          path: ${{ env.APK_NAME }}

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
