name: Release

on:
  push:
    tags: ["v*"]
    # Pushing a branch named release/vX.Y.Z makes that release (the action creates the tag).
    branches: ["release/v*"]
  # Run by hand from the Actions tab to check the signing key works, without publishing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Work out the version
        run: |
          V="${GITHUB_REF_NAME#release/}"
          echo "THOR_VERSION=${V#v}" >> "$GITHUB_ENV"
          echo "THOR_TAG=$V" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.THOR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::THOR_KEYSTORE_BASE64 secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "THOR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          THOR_KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          NAME="Thor-Tube-${THOR_TAG}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the signature and that it isn't debuggable
        run: |
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --print-certs "$APK_NAME" | tee signature.txt
          # The release key's fingerprint; anything else means the wrong key was used.
          grep -qi "1156c0e695887529200b251d20d905672566bac7de51de4f97dd7565e8c5f781" <(tr -d ':' < signature.txt | tr 'A-F' 'a-f')
          if "$TOOLS/aapt2" dump badging "$APK_NAME" | grep -q "application-debuggable"; then
            echo "::error::Release APK is debuggable"
            exit 1
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: thor-tube-release-${{ github.sha }}
          path: ${{ env.APK_NAME }}

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        with:
          tag_name: ${{ env.THOR_TAG }}
          target_commitish: ${{ github.sha }}
          name: Thor-Tube ${{ env.THOR_TAG }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
